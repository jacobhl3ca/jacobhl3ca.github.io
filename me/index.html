<!DOCTYPE html>
<html lang="en-US"><head><meta charset="utf-8">
<!-- /me is a QR hand-off target opened almost entirely on phones (see the retirement note below), so
     give its visible fallback (the <p>, shown when the instant JS/meta-refresh redirect is slow or
     blocked) the same mobile-baseline the sibling redirect stubs already carry — this stub was the one
     still missing all three. viewport: without it mobile browsers render at 980px desktop width and
     zoom out, shrinking the fallback text; with it the fallback reads at device width. color-scheme
     "light dark": this stub carries no CSS, so it renders on the UA default canvas — advertising both
     schemes lets an OS-dark browser paint the root canvas/scrollbars to match instead of dark-on-dark.
     favicon: show the site icon in the tab instead of firing a 404 for the default /favicon.ico.
     Mirrors contact/, light/ and tidytab.html; no effect on the normal redirect path. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
<!-- 2026-09-06: /me is retired. It was the in-person hand-off page reached by a QR code, and the
     only thing that ever linked to it was that QR — printed cards and a phone wallpaper that are
     already out in the world and cannot be recalled. So the page content is gone, but this stub
     stays so an old scan lands on the portfolio instead of a 404. noindex keeps it out of search;
     the canonical + 301-equivalent refresh point every signal at the homepage. Safe to delete
     outright once no old QR is in circulation. -->
<title>Jacob Heifetz-Licht</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://jacobhl.com/">
<meta http-equiv="refresh" content="0; url=https://jacobhl.com/">
<script>location.replace('https://jacobhl.com/');</script>
</head><body>
<p>This page has moved. <a href="https://jacobhl.com/">Continue to jacobhl.com</a>.</p>
</body></html>
