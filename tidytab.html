<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <!-- Give the visible fallback (the <p> below, shown when the instant JS/meta-refresh redirect is slow or blocked) proper mobile scaling. tidytab.html was the one page site-wide still missing a viewport meta — every other page (index.html, 404.html, building.html, weather/, light/, and the preview pages) declares it. Without it, mobile browsers render at a 980px desktop width and zoom out, shrinking the fallback text; with it the fallback reads at device width. Completes the site-wide viewport pattern. No effect on the normal redirect path. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Declare supported colour schemes up front. This page carries no CSS at all, so its visible fallback (the <p> below, shown when the instant JS/meta-refresh redirect is slow or blocked) renders with the UA default background/text. Without color-scheme an OS-dark browser paints the root canvas dark while treating the page as light, giving dark-on-dark (or a mismatched flash) for the fallback. "light dark" lets the bare page adapt to the visitor's OS theme so the fallback stays readable either way. tidytab.html was the one production page site-wide still missing this — every other page (index.html, 404.html, building.html, weather/, light/) already declares it. No effect on the normal redirect path. -->
  <meta name="color-scheme" content="light dark">
  <!-- Tint the mobile browser chrome (address bar / status bar) to match the bare page's own background during the brief redirect paint (the visible <p> fallback, shown when the instant JS/meta-refresh redirect is slow or blocked). This page carries no CSS, so it renders on the UA default canvas, which the color-scheme="light dark" above lets follow the visitor's OS theme — so a single static value would mismatch one theme. Two media-query variants keep the chrome aligned in both: white in light, near-black in dark (matching the site's declarative dark chrome on refer/). tidytab.html was the one production page site-wide still missing theme-color — every other page (index.html, 404.html, building.html, weather/, light/, refer/) already declares it. Completes the site-wide theme-color pattern; no effect on the normal redirect path. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
  <!-- Root-absolute favicon so this redirect stub shows the site icon in the browser tab (and on the visible fallback below when the instant redirect is slow or blocked) instead of firing a 404 for the default /favicon.ico. tidytab.html was the one production page site-wide still missing this — every other page (index.html, 404.html, building.html, weather/, light/) already declares it. Completes the site-wide favicon pattern; no effect on the normal redirect path. -->
  <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
  <title>TidyTab — moved to tidytab.jacobhl.com</title>
  <link rel="canonical" href="https://tidytab.jacobhl.com/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://tidytab.jacobhl.com/">
  <script>location.replace("https://tidytab.jacobhl.com/" + location.hash);</script>
<!-- sentry -->
<script src="https://js.sentry-cdn.com/ac636d393a29ab42c76e116c2d4d0cad.min.js" crossorigin="anonymous"></script>
<!-- /sentry -->
</head>
<body>
  <p>TidyTab has moved to <a href="https://tidytab.jacobhl.com/">tidytab.jacobhl.com</a>.</p>
</body>
</html>
